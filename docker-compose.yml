services:
  dashboard:
    build: .
    ports:
      - "8000:8000"
    # 默认离线（零 key 即可跑全部页面，只有“输入向导”的实时生成需真实 LLM）。
    # 想开实时：从宿主环境变量透传 key（不设=离线；key 不落文件）。例如：
    #   ADPILOT_LIVE=1 ADPILOT_PROVIDER=deepseek DEEPSEEK_API_KEY=... \
    #   ADPILOT_IMAGE_PROVIDER=fal FAL_KEY=... docker compose up --build
    environment:
      ADPILOT_LIVE: "${ADPILOT_LIVE:-}"
      ADPILOT_PROVIDER: "${ADPILOT_PROVIDER:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ADPILOT_IMAGE_PROVIDER: "${ADPILOT_IMAGE_PROVIDER:-}"
      FAL_KEY: "${FAL_KEY:-}"
      SILICONFLOW_API_KEY: "${SILICONFLOW_API_KEY:-}"
